name: Apply Echo Orbit V1.5.0

on:
  push:
    paths:
      - '.github/trigger-echo-v150'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release integration
        run: node .github/apply-echo-v150.mjs
      - name: Run quality checks
        run: npm test
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/trigger-echo-v150 .github/apply-echo-v150.mjs .github/workflows/apply-echo-v150.yml
          git add -A
          git commit -m "Release Brain Shift 1.5.0 Echo Orbit"
          git push