name: Enable Brain Shift GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main root
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/"},"build_type":"legacy"}')
          cat response.json
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          echo "GitHub Pages activation failed with HTTP $code"
          exit 1
