name: Apply Brain Shift V1.5.1 Cache Hotfix

on:
  push:
    paths:
      - '.github/apply-cache-v151.mjs'
      - '.github/workflows/apply-cache-v151.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: node .github/apply-cache-v151.mjs
      - name: Run quality checks
        run: npm test
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js pro.js index.html sw.js package.json tests/quality-check.mjs CHANGELOG.md
          git commit -m 'Release Brain Shift 1.5.1 PWA cache hotfix'
          git push
