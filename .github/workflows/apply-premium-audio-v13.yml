name: Apply Brain Shift Premium Audio V1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-premium-audio-v13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply premium audio patch
        run: python scripts/apply_premium_audio_v13.py

      - name: Run quality checks
        run: npm test

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-premium-audio-v13.yml
          rm scripts/apply_premium_audio_v13.py
          git add -A
          git commit -m "Release Brain Shift 1.3.0 premium sampled audio"
          git push
