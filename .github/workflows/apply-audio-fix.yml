name: Apply Brain Shift Audio Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-audio-fix.yml'

permissions:
  contents: write

jobs:
  audio-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply audio patch
        run: python scripts/apply-audio-1.2.1.py

      - name: Quality checks
        run: npm test

      - name: Commit audio release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-audio-fix.yml
          rm -f .github/workflows/apply-audio-1.2.1.yml
          rm -f scripts/apply-audio-1.2.1.py
          git add -A
          git commit -m "Release Brain Shift 1.2.1 interactive sound design"
          git push
