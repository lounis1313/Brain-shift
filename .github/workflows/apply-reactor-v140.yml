name: Apply Shift Reactor V1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-reactor-v140.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release integration
        run: python scripts/apply_reactor_release.py
      - name: Run quality checks
        run: npm test
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-reactor-v140.yml
          rm scripts/apply_reactor_release.py
          git add -A
          git commit -m "Release Brain Shift 1.4.0 Shift Reactor"
          git push
