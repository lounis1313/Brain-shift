name: Unblock Brain Shift Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unblock-pages.yml'

permissions:
  actions: write
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cancel stale Pages run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/36337904922/cancel")
          cat /tmp/response || true
          echo "HTTP ${code}"
          test "$code" = "202" || test "$code" = "409"
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/unblock-pages.yml
          git add -A
          git commit -m 'Remove temporary Pages unblock workflow'
          git push
