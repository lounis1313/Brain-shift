name: Apply Brain Shift 1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 1.2 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          if 'pro.css' not in text:
              text = text.replace('<link rel="stylesheet" href="styles.css" />', '<link rel="stylesheet" href="styles.css" />\n  <link rel="stylesheet" href="pro.css" />')
          if 'pro.js' not in text:
              text = text.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n  <script src="pro.js"></script>')
          text = text.replace('NOVELYX Studio · Version 1.1', 'NOVELYX Studio · Version 1.2')
          index.write_text(text)

          app = Path('app.js')
          text = app.read_text().replace('const APP_VERSION="1.1.0";', 'const APP_VERSION="1.2.0";')
          app.write_text(text)

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace('const CACHE="brain-shift-v1.1.1";', 'const CACHE="brain-shift-v1.2.0";')
          text = text.replace('"./styles.css","./app.js","./manifest.webmanifest"', '"./styles.css","./pro.css","./app.js","./pro.js","./manifest.webmanifest"')
          if 'SKIP_WAITING' not in text:
              text += '\nself.addEventListener("message",event=>{if(event.data?.type==="SKIP_WAITING")self.skipWaiting()});\n'
          sw.write_text(text)
          PY

      - name: Verify release
        run: npm test

      - name: Commit release integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-v1.2.yml
          git add -A
          git commit -m 'Release Brain Shift 1.2 professional polish'
          git push
